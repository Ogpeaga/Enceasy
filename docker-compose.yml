version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: enceasy-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: enceasy
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: enceasy-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/enceasy
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL}
    depends_on:
      - postgres